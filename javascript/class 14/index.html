<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background-color: #123847;
        }

        .main {
            border: 10px groove black;
            width: 30%;
            text-align: center;
            padding: 20px;
            margin: auto;
            margin-top: 100px;
            border-radius: 40px;
            font-size: xx-large;
            background-color: rgb(188, 181, 181);
        }

        button {
            width: 70px;
            padding: 8px;
            font-size: large;
            font-weight: bolder;
            background-color: black;
            color: white;
            border-radius: 20px;
            margin: 5px;
        }

        h1 {
            font-size: xx-large;
        }

        .btn {
            width: 50%;
        }

        input {
            width: 80%;
            padding: 10px;
            margin-bottom: 10px;
            background-color: black;
            color: greenyellow;
            font-size: larger;
        }

        button:hover{
            transition: 100ms;
            transform: scale(1.2);
            background-color: white;
            color: black;
        }


    </style>

</head>

<body>

    <div class="main">
        <div>
            <h1>CALCULATOR</h1>
        </div>

        <div>
            <input readonly type="text" name="" id="inp">
        </div>

        <div>
            <button onclick="clr()" class="btn">clear</button>
            <button class="btn">clear all</button>
        </div>

        <div>
            <button onclick="btnClick(7)">7</button>
            <button onclick="btnClick(8)">8</button>
            <button onclick="btnClick(9)">9</button>
            <button onclick="btnClick('+')">+</button>
        </div>

        <div>
            <button onclick="btnClick(4)">4</button>
            <button onclick="btnClick(5)">5</button>
            <button onclick="btnClick(6)">6</button>
            <button onclick="btnClick('-')">-</button>
        </div>

        <div>
            <button onclick="btnClick(3)">3</button>
            <button onclick="btnClick(2)">2</button>
            <button onclick="btnClick(1)">1</button>
            <button onclick="btnClick('*')">x</button>
        </div>

        <div>
            <button onclick="btnClick(0)">0</button>
            <button onclick="btnClick('/')">/</button>
            <button onclick="btnClick('.')">.</button>
            <button onclick="satti()">=</button>
        </div>
    </div>


    <script src="app.js"></script>
</body>

</html>
